[project]
name = "multi-agent-research-system"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["research"]

[tool.uv.sources]
research = { workspace = true }

[tool.uv.workspace]
members = [
    "packages/research",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages"]
